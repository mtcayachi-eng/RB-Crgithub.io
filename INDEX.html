:16px;width:fit-content;margin:0 auto 16px;line-height:0}.x{padding:11px 28px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 .95rem "Tajawal",sans-serif;cursor:pointer}.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#1c1405;padding:11px 20px;border-radius:12px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;max-width:90vw}.toast.on{opacity:1}@media (prefers-reduced-motion:reduce){.mask.on{animation:none}*{transition:none!important}}</style></head><body><main class="card">  <div class="ph"><img alt="عبد الرؤوف بوحبيلة" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAEsASwDASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAAECAwQFBgcI/8QAPRAAAQMDAwIFAgUBBwQBBQAAAQACAwQFERIhMQZBBxMiUWEycRQjgZGhQggVJDNSscElU6LRYmN0guHw/8QAGwEAAgMBAQEAAAAAAAAAAAAAAAECAwQFBgf/xAApEQACAgICAgIDAAICAwAAAAAAAQIRAwQSIQUxE0EGIjIUUSNhFTNi/9oADAMBAAIRAxEAPwDrSGUSJd4YrKNIS0yIByjyiQTEwyUAiQTANBFlDKCLYRKQ4pR4SCixCXFI1I3JCTExeUpvKbBS2pCOa+LLwaZsZOxIXOJZmwQegbLd+LbsiNvu4LnNd6aZeW81N8lFHq/xnBCblKSshy1shaSCVXvqpHOILincZjPyomgmRceCR6ycP9D8L3uO5KlNJ1AFzsJuNukA4RTSaW7JPt9E4QUVbHZZD2cVItI82QtdlVsDy8Ensrzp6IGQklRyKo0XYUpSBWxGEZBOFXmd7Tlp4WhuceqE4CzFQCx3PKrxd9FmxjivaJMNzljcQeCry33VhLdZP3WR+p26eeS1jdJIPPK1RnKH8s4m14rW2k1kgjtFlrKeooiI3gu4wqmtH5z/AHyufWy7VFHI0h7sZ91tqarbX04kYfWOQuvqeQbfCZ8t/IfweOspbOp6/wBEqyu8u8U7j/qAXdaQ5pYznsFwWifiuhf7OC7ranaqGI55AXexu1Zw/ANrlFktBBBWnpQktpSUYSAUUSJKwkMqcoIkMq0vDR5Sco0CFBGiCNSEBBBBMiBEUfZJKQgidk2UtybJSYhLikoOKJAmw0tp2SEY4R9ETlHixvURAb7rnV0yImjGNl0PxPdrrYm9wVzi6TFztJ7LyXmHeVI9x+MR/wCKUiEBiMJDNGvdPOAEQUB7iHbLlRVnpZOuyfLIxrdlW1EuonGOUlz3OGCU1pOSrYQooy5HLpEykHoOe601hY4McQFnYQAxq1llaBSD5VGZm7UiO1UjWxFsnKytxePN9K     <a class="btn" id="call"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>اتصال مباشر</a>
    <a class="btn wa" id="wa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2-5.5A8.4 8.4 0 1 1 21 11.5z"/></svg>محادثة واتساب</a>
    <a class="btn" id="map" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>الموقع على الخريطة</a>
    <a class="btn" id="mail"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>البريد الإلكتروني</a>
  </div>

  <div class="soc" id="soc"></div>

  <button class="btn qrb" id="qrBtn" type="button">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h3M20 17v4"/></svg>
    عرض رمز QR للبطاقة
  </button>
  <div class="org" id="org"></div>
</main>

<div class="mask" id="mask" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="modal">
    <h2 id="mt">امسح الرمز لفتح البطاقة</h2>
    <p>وجّه كاميرا هاتفك نحو الرمز</p>
    <div id="qr"></div>
    <button class="x" id="closeQr" type="button">إغلاق</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== بيانات البطاقة: عدّل القيم هنا فقط ===== */
const C={
  first:"عبد الرؤوف", last:"بوحبيلة",
  title:"عضو مجلس التجديد الاقتصادي الجزائري (CREA)",
  title2:"الممثل الجهوي لولاية بومرداس · رائد أعمال ومستثمر",
  bio:"رائد أعمال ومستثمر جزائري، يمثّل مجلس التجديد الاقتصادي في ولاية بومرداس. أدعم المبادرات الاقتصادية وأبني شراكات تصنع القيمة.",
  org:"مجلس التجديد الاقتصادي الجزائري – CREA",
  phone:"+213672551740",        // ← ضع رقمك الحقيقي
  whatsapp:"213672551740",      // ← بصيغة دولية بدون +
  email:"contact@example.com",  // ← بريدك الحقيقي
  mapsQuery:"Boumerdès, Algeria", // ← عنوان الشركة بدقة
  cardUrl:"",                   // ← رابط البطاقة بعد النشر (إن تُرك فارغاً يُستخدم رابط الصفحة)
  social:{
    facebook:"https://www.facebook.com/raouf.bouhabila",
    linkedin:"https://www.linkedin.com/",
    instagram:"https://www.instagram.com/"
  }
};
/* ============================================ */
const $=id=>document.getElementById(id);
const fullName=C.first+" "+C.last;
$("nm").textContent=fullName;$("r1").textContent=C.title;$("r2").textContent=C.title2;
$("bio").textContent=C.bio;$("org").textContent=C.org;
$("call").href="tel:"+C.phone;
$("wa").href="https://wa.me/"+C.whatsapp;
$("map").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(C.mapsQuery);
$("mail").href="mailto:"+C.email;
const ICON={
 facebook:'<path d="M14 8.5V7c0-.8.2-1.2 1.3-1.2H17V3h-2.6C11.6 3 10.5 4.600 10.5 6.800v1.700H8V11.500h2.500V21H14v-9.500h2.600l.4-3z"/>',
 linkedin:'<path d="M4.500 9H8v11H4.500zM6.200 3.500a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM10 9h3.300v1.500c.5-.9 1.700-1.800 3.400-1.800 3.500 0 4.100 2.300 4.100 5.300V20h-3.500v-5.200c0-1.300 0-2.900-1.800-2.900s-2 1.400-2 2.800V20H10z"/>',
 instagram:'<path d="M7.500 3h9A4.500 4.500 0 0 1 21 7.500v9a4.500 4.500 0 0 1-4.500 4.500h-9A4.500 4.500 0 0 1 3 16.500v-9A4.500 4.500 0 0 1 7.500 3zm0 1.800A2.700 2.700 0 0 0 4.800 7.500v9a2.700 2.700 0 0 0 2.700 2.700h9a2.700 2.700 0 0 0 2.700-2.700v-9a2.700 2.700 0 0 0-2.700-2.700zM12 7.800a4.200 4.200 0 1 1 0 8.400 4.200 4.200 0 0 1 0-8.400zm0 1.800a2.400 2.400 0 1 0 0 4.800 2.400 2.400 0 0 0 0-4.800zm4.800-3.300a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>'
};
Object.entries(C.social).forEach(([k,u])=>{if(!u||!ICON[k])return;
  const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";a.setAttribute("aria-label",k);
  a.innerHTML='<svg viewBox="0 0 24 24">'+ICON[k]+'</svg>';$("soc").appendChild(a);});

function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2600);}

/* ---- vCard ---- */
function vcard(){
  return ["BEGIN:VCARD","VERSION:3.0",
   "N:"+C.last+";"+C.first+";;;","FN:"+fullName,
   "ORG:"+C.org,"TITLE:"+C.title,
   "TEL;TYPE=CELL,VOICE:"+C.phone,"EMAIL;TYPE=INTERNET:"+C.email,
   "ADR;TYPE=WORK:;;;Boumerdès;;;DZ","URL:"+(C.cardUrl||location.href),
   "END:VCARD"].join("\r\n");
}
$("saveBtn").addEventListener("click",async()=>{
  const data=vcard(), name="Abderraouf-Bouhabila.vcf";
  try{
    const d=window.claude&&await window.claude.use("downloads");
    if(d){await d.save({filename:name,data});toast("تم تجهيز الملف، افتحه لحفظ الاسم في جهات الاتصال");return;}
  }catch(e){if(e&&e.code==="declined")return;}
  try{ /* مسار عادي عند فتح الصفحة خارج النافذة */
    const b=new Blob([data],{type:"text/vcard;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;
    document.body.appendChild(a);a.click();a.remove();toast("جارٍ تنزيل ملف جهة الاتصال");
  }catch(e){toast("تعذّر التنزيل هنا. افتح البطاقة في المتصفح مباشرة");}
});

/* ---- QR ---- */
let made=false;
function openQr(){
  const url=C.cardUrl||location.href;
  if(!made||$("qr").dataset.u!==url){
    $("qr").innerHTML="";$("qr").dataset.u=url;
    try{new QRCode($("qr"),{text:url,width:210,height:210,colorDark:"#0a1330",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});made=true;}
    catch(e){$("qr").textContent="تعذّر إنشاء الرمز";}
  }
  $("mask").classList.add("on");$("closeQr").focus();
}
$("qrBtn").addEventListener("click",openQr);
$("closeQr").addEventListener("click",()=>$("mask").classList.remove("on"));
$("mask").addEventListener("click",e=>{if(e.target===$("mask"))$("mask").classList.remove("on");});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("mask").classList.remove("on");});
</script>
</body>
</html>
